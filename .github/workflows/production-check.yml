name: Production Check

on:
  push:
    branches:
      - main
      - refactor/platform-architecture
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check for tracked private-key material
        shell: bash
        run: |
          if git grep -n -I -E 'BEGIN (RSA|EC|OPENSSH|PRIVATE KEY)|private_key.*BEGIN|FIREBASE_PRIVATE_KEY.*\\\\n' -- ':!docs/*' ':!*.md'; then
            echo "Potential private-key material is tracked in source. Rotate exposed credentials and remove them from history."
            exit 1
          fi
